name: Build and validate Stellae

on:
  push:
    branches: ['release/stellae-*', 'ci/settings-*']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

defaults:
  run:
    shell: pwsh
    working-directory: frontend

jobs:
  runtime-engines:
    runs-on: windows-2022
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            compiler: x64
            variant: engine-n01
    steps:
      - uses: actions/checkout@v4
        with:
          path: frontend
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.compiler }}
      - name: Assemble fixed engine sources
        run: ./scripts/native/Prepare-Sources.ps1 -Variant '${{ matrix.variant }}' -Destination (Join-Path $env:RUNNER_TEMP 'runtime-source')
      - name: Compile and test the runtime engine
        run: ./scripts/native/Build-Engine.ps1 -Variant '${{ matrix.variant }}' -Architecture '${{ matrix.architecture }}' -SourcePath (Join-Path $env:RUNNER_TEMP 'runtime-source') -CacheDirectory (Join-Path $env:RUNNER_TEMP 'runtime-cache') -OutputDirectory (Join-Path $env:RUNNER_TEMP 'runtime-output')
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-runtime-${{ matrix.architecture }}
          path: ${{ runner.temp }}/runtime-output
          if-no-files-found: error
          retention-days: 14

  frontend-images:
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]
    name: Build frontend and application compatibility clients (${{ matrix.architecture }})
    steps:
      - uses: actions/checkout@v4
        with:
          path: frontend
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.architecture }}
      - name: Assemble pinned frontend source
        run: ./scripts/native/Prepare-Sources.ps1 -Variant stellae-61052 -Destination "$env:RUNNER_TEMP/frontend-source"
      - name: Compile the x64 backend or x86 compatibility clients
        env:
          APPEARANCE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'frontend-source'
          $out = Join-Path $env:RUNNER_TEMP 'frontend-output'
          $role = @{}
          if ($env:APPEARANCE_ARCHITECTURE -ceq 'x86') { $role.ClientOnly = $true }
          ./scripts/native/Build-FrontendOverlay.ps1 -Architecture $env:APPEARANCE_ARCHITECTURE @role -SourcePath $source -CacheDirectory "$env:RUNNER_TEMP/frontend-cache" -OutputDirectory $out
          if ($env:APPEARANCE_ARCHITECTURE -cne 'x64') { return }

          # The clean release directory was copied by Build-FrontendOverlay.
          # This second link is used only by the isolated Windows test.
          $cleanServer = Join-Path $out 'release/StellaeServer.exe'
          $cleanRecord = Get-Content -LiteralPath (Join-Path $out 'release/build-result.json') -Raw | ConvertFrom-Json
          $cleanHash = (Get-FileHash -LiteralPath $cleanServer).Hash.ToLowerInvariant()
          ./native/tests/appearance/Add-PaintTrace.ps1 -SourceRoot $source
          $log = Join-Path $out 'logs/appearance-trace-build.log'
          Push-Location -LiteralPath $source
          try {
            & msbuild.exe weasel.sln /m /t:WeaselServer:Rebuild /p:Configuration=Release /p:Platform=x64 /v:minimal 2>&1 | Tee-Object -FilePath $log
            if ($LASTEXITCODE) { throw 'The isolated appearance instrumentation failed to compile.' }
          } finally { Pop-Location }
          $testOutput = Join-Path $out 'appearance-test-server'
          $null=New-Item -ItemType Directory -Path $testOutput
          $testServer = Join-Path $testOutput 'StellaeServer.AppearanceTrace.exe'
          Copy-Item -LiteralPath (Join-Path $source 'output/StellaeServer.exe') -Destination $testServer
          $traceHash = (Get-FileHash -LiteralPath $testServer).Hash.ToLowerInvariant()
          if ($traceHash -ceq $cleanHash -or (Get-FileHash -LiteralPath $cleanServer).Hash.ToLowerInvariant() -cne $cleanHash) {
            throw 'The clean installer server and the instrumented server are required as distinct images.'
          }
          [ordered]@{
            sourceRef=$env:GITHUB_SHA; cleanServerSha256=$cleanHash; traceServerSha256=$traceHash
            nativeSourceArchiveSha256=$cleanRecord.candidateSourceArchiveSha256
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $testOutput 'appearance-test-server-proof.json') -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-images-${{ matrix.architecture }}
          path: ${{ runner.temp }}/frontend-output/release
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: matrix.architecture == 'x64'
        with:
          name: appearance-test-server
          path: ${{ runner.temp }}/frontend-output/appearance-test-server
          if-no-files-found: error
          retention-days: 7
      - name: Preserve intermediate diagnostics for compilation failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appearance-build-failure-${{ matrix.architecture }}
          path: ${{ runner.temp }}/frontend-output/logs/*.log
          if-no-files-found: warn
          retention-days: 7

  compatibility-client:
    needs: [frontend-images, runtime-engines]
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: frontend
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - uses: actions/download-artifact@v4
        with:
          name: frontend-images-x64
          path: ${{ runner.temp }}/compatibility-backend
      - uses: actions/download-artifact@v4
        with:
          name: bundle-runtime-x64
          path: ${{ runner.temp }}/compatibility-engine
      - name: Check a 32-bit COM client against the single x64 service
        run: |
          $source=Join-Path $env:RUNNER_TEMP 'compatibility-source'
          ./scripts/native/Prepare-Sources.ps1 -Variant stellae-61052 -Destination $source
          ./scripts/native/Build-FrontendOverlay.ps1 -Architecture x86 -ClientOnly -SourcePath $source -CacheDirectory (Join-Path $env:RUNNER_TEMP 'compatibility-cache') -OutputDirectory (Join-Path $env:RUNNER_TEMP 'compatibility-client-build')
          $output=Join-Path $source 'output'
          $backend=Join-Path $env:RUNNER_TEMP 'compatibility-backend'
          Copy-Item -LiteralPath (Join-Path $backend 'StellaeServer.exe') -Destination $output
          $engine=Join-Path $env:RUNNER_TEMP 'compatibility-engine/dist/lib/rime.dll'
          Copy-Item -LiteralPath $engine -Destination $output
          $shared=Join-Path $output 'data'
          $null=New-Item -ItemType Directory -Path $shared -Force
          Copy-Item -LiteralPath installer/default.yaml -Destination $shared
          Copy-Item -LiteralPath native/tests/key-pairing/fixture/weasel.yaml -Destination $shared
          ./native/tests/key-pairing/Run-ControlledKeys.ps1 -SourceRoot $source -SharedData $shared -Architecture Win32 -UseX64Backend -RuntimeN01 $engine
          if(Test-Path -LiteralPath (Join-Path $output 'Win32/StellaeServer.exe')){throw 'The application compatibility test must not build an x86 service'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-client-validation
          path: ${{ runner.temp }}/compatibility-source/ci-logs/controlled-keys-win32*.json
          if-no-files-found: warn
          retention-days: 14

  official-scheme:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: frontend
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the official engine and source-derived scheme
        run: |
          $runtime=Join-Path $env:RUNNER_TEMP 'official-validation-engines'
          ./schemes/scripts/schemes/Prepare-ValidationEngines.ps1 -Source official -OutputDirectory $runtime
          $official=Join-Path $env:RUNNER_TEMP 'official-source-profile'
          python schemes/scripts/rebuild_profiles.py --profile official-weasel --output (Join-Path $env:RUNNER_TEMP 'official-generated-profile') --prepare-official $official
          if($LASTEXITCODE){throw 'Official profile generation failed'}
          $hostExe=(Get-Process -Id $PID).Path
          & $hostExe -NoProfile -ExecutionPolicy Bypass -File schemes/tests/rebuilt-profile/Test-RebuiltProfile.ps1 -Kind official-weasel -GeneratedProfile $official -EnginePath (Join-Path $runtime 'official-x64/rime.dll') -OutputPath (Join-Path $env:RUNNER_TEMP 'official-profile-tests')
          if($LASTEXITCODE){throw 'Official engine scheme checks failed'}
          $proof=Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'official-profile-tests/proof.json') -Raw|ConvertFrom-Json
          if(-not $proof.Passed -or @($proof.Checks).Count -ne 76){throw 'Official engine evidence is incomplete'}
      - name: Retain the official scheme checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-scheme-validation
          path: |
            ${{ runner.temp }}/official-profile-tests/proof.json
            ${{ runner.temp }}/official-profile-tests/rebuilt-binaries.json
            ${{ runner.temp }}/official-validation-engines/runtimes.json
          if-no-files-found: warn
          retention-days: 14

  bundle:
    needs: [frontend-images, runtime-engines, compatibility-client, official-scheme]
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: frontend
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: frontend-images-x64
          path: ${{ runner.temp }}/frontend-overlays/x64
      - uses: actions/download-artifact@v4
        with:
          name: frontend-images-x86
          path: ${{ runner.temp }}/frontend-overlays/x86
      - uses: actions/download-artifact@v4
        with:
          name: bundle-runtime-x64
          path: ${{ runner.temp }}/runtime-engines/x64
      - name: Check source and fixed scheme input
        id: inputs
        run: |
          python -m pip install PyYAML==6.0.2
          python scripts/verify_release.py --require-yaml
          if($LASTEXITCODE){throw 'Source inventory failed'}
          $spec=Get-Content -LiteralPath installer/bundle-inputs.json -Raw|ConvertFrom-Json
          if(-not $spec.schemes -or $spec.schemes.sourceDirectory -cne 'schemes' -or $spec.schemes.profile -cne 'stellae'){throw 'The base scheme must belong to this source repository'}
          "bundle_version=$($spec.bundleVersion)" >> $env:GITHUB_OUTPUT
          python -m unittest discover -s native/tests/package -p 'test_*.py'
          if($LASTEXITCODE){throw 'Package boundary tests failed'}
      - name: Build the base and official scheme archives from this commit
        run: |
          $spec=Get-Content -LiteralPath installer/bundle-inputs.json -Raw|ConvertFrom-Json
          python schemes/scripts/rebuild_profiles.py --check
          if($LASTEXITCODE){throw 'Maintained scheme derivation differs'}
          python schemes/scripts/build_scheme_packages.py --profile all --version $spec.schemes.version --output-dir (Join-Path $env:RUNNER_TEMP 'scheme-input') --source-ref $env:GITHUB_SHA
          if ($LASTEXITCODE) { throw 'Scheme archive build failed.' }
      - name: Verify the base scheme with the freshly built N01 engine
        run: |
          $generated=Join-Path $env:RUNNER_TEMP 'source-derived-profiles'
          python schemes/scripts/rebuild_profiles.py --output $generated
          if($LASTEXITCODE){throw 'Profile generation failed'}
          $profile=Join-Path $generated 'config/pc'
          $engine=Join-Path $env:RUNNER_TEMP 'runtime-engines/x64/dist/lib/rime.dll'
          $reports=Join-Path $env:RUNNER_TEMP 'source-profile-tests'
          $hostExe=(Get-Process -Id $PID).Path
          & $hostExe -NoProfile -ExecutionPolicy Bypass -File schemes/tests/rebuilt-profile/Test-RebuiltProfile.ps1 -Kind pc -GeneratedProfile $profile -EnginePath $engine -OutputPath $reports
          if($LASTEXITCODE){throw 'Fresh N01 scheme checks failed'}
          $proof=Get-Content -LiteralPath (Join-Path $reports 'proof.json') -Raw|ConvertFrom-Json
          if(-not $proof.Passed -or @($proof.Checks).Count -ne 76){throw 'Fresh N01 scheme evidence is incomplete'}
      - name: Test shared file preservation with synthetic sources
        run: ./native/tests/installer/Test-BundleData.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'shared-policy')
      - name: Test scheme notice upgrade ownership
        run: ./native/tests/installer/Test-BundleNotices.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'notices-policy')
      - name: Test source layout migration and modified user sources
        run: ./native/tests/installer/Test-BundleSourceLayout.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'source-layout-policy')
      - name: Provision the pinned NSIS compiler
        run: |
          $root=Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          $compiler=Join-Path $root 'Bin/makensis.exe'
          if ((Test-Path -LiteralPath $compiler) -and ((& $compiler /VERSION | Out-String).Trim()) -ceq 'v3.11') { return }
          $installer=Join-Path $env:RUNNER_TEMP 'nsis-3.11-setup.exe'
          $expected='38D49F8FE09B1C332B01D0940E57B7258F4447733643273A01C59959AD9D3B0A'
          $verified=$false
          foreach ($mirror in 'downloads.sourceforge.net','master.dl.sourceforge.net','pilotfiber.dl.sourceforge.net') {
            curl.exe -fsSL --connect-timeout 10 --max-time 30 --output $installer "https://$mirror/project/nsis/NSIS%203/3.11/nsis-3.11-setup.exe"
            if ($LASTEXITCODE -eq 0 -and (Get-FileHash -LiteralPath $installer).Hash -ceq $expected) {
              $verified=$true
              break
            }
          }
          if (-not $verified) { throw 'Could not obtain the pinned NSIS 3.11 installer.' }
          $process=Start-Process -FilePath $installer -ArgumentList "/S /D=$root" -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -or ((& $compiler /VERSION | Out-String).Trim()) -cne 'v3.11') { throw 'NSIS 3.11 setup failed.' }
      - name: Compile and extract the dated installer
        run: |
          $overlays=Join-Path $env:RUNNER_TEMP 'frontend-overlays'
          $spec=Get-Content -LiteralPath installer/bundle-inputs.json -Raw|ConvertFrom-Json
          $schemeArchive=Join-Path $env:RUNNER_TEMP "scheme-input/stellae-$($spec.schemes.version)-schemes.zip"
          ./scripts/package/Build-Bundle.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'bundle') -NativeProductDirectory $overlays -NativeSourceDirectory $overlays -NativeEngineDirectory (Join-Path $env:RUNNER_TEMP 'runtime-engines') -SchemeArchive $schemeArchive
          Copy-Item -Path (Join-Path $env:RUNNER_TEMP 'scheme-input/*.zip') -Destination (Join-Path $env:RUNNER_TEMP 'bundle/release')
      - uses: actions/download-artifact@v4
        with:
          name: appearance-test-server
          path: ${{ runner.temp }}/appearance-test-server
      - name: Stage the reviewed test inputs
        run: |
          $bundle=Join-Path $env:RUNNER_TEMP 'bundle'
          $out=Join-Path $env:RUNNER_TEMP 'appearance-test-input'
          $null=New-Item -ItemType Directory -Path $out
          $spec=Get-Content -LiteralPath installer/bundle-inputs.json -Raw | ConvertFrom-Json
          $release=Join-Path $bundle 'release'
          $proof=Get-Content -LiteralPath (Join-Path $release 'payload-verification.json') -Raw | ConvertFrom-Json
          if (-not $proof.passed -or $proof.sourceRef -cne $env:GITHUB_SHA -or $proof.rebuiltRuntimeEngines.Count -ne 1 -or
              $proof.backendArchitecture -cne 'x64' -or ($proof.compatibilityClientArchitectures -join ',') -cne 'x86' -or
              $proof.candidateFontCollection.path -cne 'font-payload/NotoSansCJK-Regular.ttc' -or
              $proof.candidateFontCollection.sha256 -cne 'b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a') {
            throw 'The package proof does not match this source snapshot'
          }
          $required=@('stellaex64.dll','stellaex64.ime','StellaeDeployer.exe','StellaeServer.exe','stellae.dll','stellae.ime')
          foreach ($name in $required) {
            if (@($proof.rebuiltImages | Where-Object { $_.path -ceq $name -and $_.sourceRef -ceq $env:GITHUB_SHA }).Count -ne 1) {
              throw "The installer did not verify a rebuilt appearance binary: $name"
            }
          }
          $testRoot=Join-Path $env:RUNNER_TEMP 'appearance-test-server'
          $testServer=Join-Path $testRoot 'StellaeServer.AppearanceTrace.exe'
          $testProof=Get-Content -LiteralPath (Join-Path $testRoot 'appearance-test-server-proof.json') -Raw | ConvertFrom-Json
          $cleanProof=@($proof.rebuiltImages | Where-Object { $_.path -ceq 'StellaeServer.exe' })[0]
          $sourceArchive=Join-Path $env:RUNNER_TEMP 'frontend-overlays/x64/candidate-source.zip'
          if ($testProof.sourceRef -cne $env:GITHUB_SHA -or $testProof.cleanServerSha256 -cne $cleanProof.sha256 -or
              (Get-FileHash -LiteralPath $testServer).Hash -ine $testProof.traceServerSha256 -or
              (Get-FileHash -LiteralPath $sourceArchive).Hash -ine $testProof.nativeSourceArchiveSha256) {
            throw 'The isolated tracer must match the source used by the verified installer.'
          }
          Copy-Item -LiteralPath (Join-Path $release "stellae-$($spec.bundleVersion)-installer.exe") -Destination (Join-Path $out 'stellae-installer.exe')
          Copy-Item -LiteralPath (Join-Path $release 'payload-verification.json') -Destination $out
          Copy-Item -LiteralPath $testServer,(Join-Path $testRoot 'appearance-test-server-proof.json') -Destination $out
          $files=@(Get-ChildItem -LiteralPath $out -Recurse -File | Sort-Object FullName | ForEach-Object {
            @{path=[IO.Path]::GetRelativePath($out,$_.FullName).Replace('\','/'); sha256=(Get-FileHash -LiteralPath $_.FullName).Hash.ToLowerInvariant()}
          })
          [ordered]@{sourceRef=$env:GITHUB_SHA;files=$files} | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $out 'input-proof.json') -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: appearance-test-input
          path: ${{ runner.temp }}/appearance-test-input
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Test actual installation, shared-only input, upgrades and uninstall
        if: ${{ !startsWith(github.ref_name, 'ci/settings-') }}
        env:
          STELLAE_INSTALLER_POLICY_TRACE: '1'
        run: ./native/tests/installer/Test-BundleInstaller.ps1 -PackageDirectory (Join-Path $env:RUNNER_TEMP 'bundle') -SchemeSource (Join-Path $env:GITHUB_WORKSPACE 'frontend/schemes') -OutputDirectory (Join-Path $env:RUNNER_TEMP 'installer-validation')
      - name: Record finite release validation
        if: ${{ !startsWith(github.ref_name, 'ci/settings-') }}
        run: |
          $checks=@((Join-Path $env:RUNNER_TEMP 'shared-policy/result.json'),(Join-Path $env:RUNNER_TEMP 'installer-validation/result.json'),(Join-Path $env:RUNNER_TEMP 'installer-validation/installed-ready/result.json'),(Join-Path $env:RUNNER_TEMP 'profile-policy/win11-equivalent-policy-result.json'),(Join-Path $env:RUNNER_TEMP 'bundle/stage/output/server-overlay-verification.json'),(Join-Path $env:RUNNER_TEMP 'source-profile-tests/proof.json'))
          foreach($path in $checks){$report=Get-Content -LiteralPath $path -Raw|ConvertFrom-Json;if(-not $report.passed){throw 'A required validation failed'}}
          $release=Join-Path $env:RUNNER_TEMP 'bundle/release'
          $overlay=Get-Content -LiteralPath (Join-Path $release 'frontend-overlay-verification.json') -Raw|ConvertFrom-Json
          if ($overlay.runtimeEnginesPreserved -ne $false -or $overlay.rebuiltRuntimeEngines.Count -ne 1 -or $overlay.backendArchitecture -cne 'x64') { throw 'The installer must contain only the rebuilt x64 backend.' }
          $spec=Get-Content -LiteralPath installer/bundle-inputs.json -Raw|ConvertFrom-Json
          [ordered]@{passed=$true;bundleVersion=$spec.bundleVersion;frontendVersion=$spec.frontendVersion;sourceRef=$env:GITHUB_SHA;backendArchitecture='x64';compatibilityClientArchitectures=@('x86');rebuiltImages=$overlay.rebuiltImages.Count;rebuiltRuntimeEngines=$overlay.rebuiltRuntimeEngines.Count;unchangedNativeImages=$overlay.unchangedNativeImages;sourceDerivedN01Checks=76;sharedOnlyN01InputTested=$true;bundlePresetAndUserPriorityTested=$true;actualInstalledProfileReadyWithoutTestRedeploy=$true;bare61052UpgradeTested=$true;installedUpgradeAndUninstallTested=$true;physicalKeyboardTested=$false;actualWindows11Tested=$false}|ConvertTo-Json|Set-Content -LiteralPath (Join-Path $release 'validation.json') -Encoding UTF8
          Get-ChildItem -LiteralPath $release -File|Where-Object {$_.Name -ne 'SHA256SUMS.txt'}|Sort-Object Name|ForEach-Object{(Get-FileHash -LiteralPath $_.FullName).Hash.ToLowerInvariant()+'  '+$_.Name}|Set-Content -LiteralPath (Join-Path $release 'SHA256SUMS.txt') -Encoding ASCII
      - name: Record settings trial validation
        if: startsWith(github.ref_name, 'ci/settings-')
        run: |
          foreach($relative in @('shared-policy/result.json','notices-policy/result.json','source-profile-tests/proof.json')) {
            $result=Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP $relative) -Raw|ConvertFrom-Json
            if(-not $result.passed){throw 'A required settings trial check failed'}
          }
          $release=Join-Path $env:RUNNER_TEMP 'bundle/release'
          [ordered]@{passed=$true;validationScope='settings-trial';sourceRef=$env:GITHUB_SHA;sourceDerivedN01Checks=76;fullInstallerMatrixTested=$false;appearanceAndDraftCheckedInSeparateJobs=$true}|ConvertTo-Json|Set-Content -LiteralPath (Join-Path $release 'validation.json') -Encoding utf8NoBOM
          Get-ChildItem -LiteralPath $release -File|Where-Object {$_.Name -ne 'SHA256SUMS.txt'}|Sort-Object Name|ForEach-Object{(Get-FileHash -LiteralPath $_.FullName).Hash.ToLowerInvariant()+'  '+$_.Name}|Set-Content -LiteralPath (Join-Path $release 'SHA256SUMS.txt') -Encoding ASCII
      - uses: actions/upload-artifact@v4
        with:
          name: stellae-${{ steps.inputs.outputs.bundle_version }}-release
          path: ${{ runner.temp }}/bundle/release
          if-no-files-found: error
          retention-days: 30
      - name: Preserve bounded synthetic validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stellae-${{ steps.inputs.outputs.bundle_version }}-validation
          path: |
            ${{ runner.temp }}/bundle/*.json
            ${{ runner.temp }}/bundle/*.log
            ${{ runner.temp }}/shared-policy/*.json
            ${{ runner.temp }}/notices-policy/*.json
            ${{ runner.temp }}/source-layout-policy/**/*.json
            ${{ runner.temp }}/installer-validation/*.json
            ${{ runner.temp }}/installer-validation/*.log
            ${{ runner.temp }}/installer-validation/installed-ready/*.json
            ${{ runner.temp }}/installer-validation/shared-x64/**/result*.json
            ${{ runner.temp }}/profile-policy/*.json
            ${{ runner.temp }}/source-profile-tests/proof.json
            ${{ runner.temp }}/source-profile-tests/rebuilt-binaries.json
            ${{ github.workspace }}/policy-diagnostics/*.json
          if-no-files-found: warn
          retention-days: 14

  appearance-runtime:
    needs: bundle
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile: [SC, TC]
    name: Installed candidate window changes font during composition (${{ matrix.profile }})
    steps:
      - uses: actions/checkout@v4
        with:
          path: frontend
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixture YAML reader
        run: python -m pip install PyYAML==6.0.2
      - uses: actions/download-artifact@v4
        with:
          name: appearance-test-input
          path: ${{ runner.temp }}/appearance-test-input
      - name: Check the test artifact
        run: |
          $inputRoot=Join-Path $env:RUNNER_TEMP 'appearance-test-input'
          $index=Get-Content -LiteralPath (Join-Path $inputRoot 'input-proof.json') -Raw | ConvertFrom-Json
          if ($index.sourceRef -cne $env:GITHUB_SHA) { throw 'The artifact belongs to another source snapshot' }
          $names=@(Get-ChildItem -LiteralPath $inputRoot -Recurse -File | ForEach-Object {
            [IO.Path]::GetRelativePath($inputRoot,$_.FullName).Replace('\','/')
          } | Where-Object { $_ -cne 'input-proof.json' })
          if (Compare-Object -ReferenceObject @($index.files.path) -DifferenceObject $names) { throw 'Unexpected test input files' }
          foreach ($file in $index.files) {
            if ((Get-FileHash -LiteralPath (Join-Path $inputRoot $file.path)).Hash -ine $file.sha256) {
              throw ('Test input hash differs: ' + $file.path)
            }
          }
      - name: Verify active composition and rendered appearance through the installed frontend
        env:
          STELLAE_TEST_PROFILE: ${{ matrix.profile }}
        run: |
          $inputRoot=Join-Path $env:RUNNER_TEMP 'appearance-test-input'
          ./native/tests/appearance/Test-LiveFont.ps1 -Installer (Join-Path $inputRoot 'stellae-installer.exe') -Profile $env:STELLAE_TEST_PROFILE -InstrumentedServer (Join-Path $inputRoot 'StellaeServer.AppearanceTrace.exe') -OutputDirectory (Join-Path $env:RUNNER_TEMP 'appearance-evidence')
      - name: Verify dictionary labels and snapshot identity
        run: |
          $headers=Join-Path $env:RUNNER_TEMP 'dictionary-api-headers'
          $null=New-Item -ItemType Directory -Path $headers
          $inputs=Get-Content -LiteralPath native/notification-inputs.json -Raw|ConvertFrom-Json
          foreach($header in $inputs.apiHeaders){
            $file=Join-Path $headers $header.name
            Invoke-WebRequest -Uri $header.url -OutFile $file -TimeoutSec 60
            if((Get-FileHash -LiteralPath $file).Hash -ine $header.sha256){throw 'Dictionary API header differs'}
          }
          $program=Join-Path $env:ProgramFiles 'RimeStellae'
          python native/tests/settings/Probe-DictionaryManager.py --engine (Join-Path $program 'rime.dll') --header (Join-Path $headers 'rime_api.h') --shared (Join-Path $program 'data') --user (Join-Path $env:RUNNER_TEMP 'dictionary-user') --deployer (Join-Path $program 'StellaeDeployer.exe') --report (Join-Path $env:RUNNER_TEMP 'appearance-evidence/dictionaries.json')
          if($LASTEXITCODE){throw 'Native dictionary manager checks failed'}
      - name: Upload bounded synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appearance-live-evidence-${{ matrix.profile }}
          path: |
            ${{ runner.temp }}/appearance-evidence/*.json
            ${{ runner.temp }}/appearance-evidence/*.log
            ${{ runner.temp }}/appearance-evidence/*.png
          if-no-files-found: warn
          retention-days: 7
